name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DECANTR_CONTENT_DIR: ${{ github.workspace }}/decantr-content
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: decantr-ai/decantr-content
          path: decantr-content
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit:docs-marketing
      - run: pnpm audit:package-surface
      - run: pnpm audit:registry-authenticated
      - run: DECANTR_CONTENT_DIR="$GITHUB_WORKSPACE/decantr-content" pnpm audit:blueprint-matrix
        if: matrix.node-version == 20
      - run: pnpm audit:registry-dogfood
      - run: pnpm run showcase:validate
        if: matrix.node-version == 20
      - run: pnpm run showcase:verify:shortlist
        if: matrix.node-version == 20
      - run: pnpm run showcase:dogfood-promote
        if: matrix.node-version == 20
      - run: SHOWCASE_GOLDEN_ONLY=1 node scripts/copy-showcase-dist.mjs --dry-run
        if: matrix.node-version == 20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.node-version == 20
        with:
          name: showcase-shortlist-verification
          path: apps/showcase/reports/shortlist-verification.json
