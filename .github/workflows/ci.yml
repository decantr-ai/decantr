name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Decantr Project Health
        if: matrix.node-version == 20
        run: |
          cd docs
          node ../packages/cli/dist/bin.js health --ci --fail-on error --markdown --output ../decantr-health.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && matrix.node-version == 20 }}
        with:
          name: decantr-project-health
          path: decantr-health.md
      - run: pnpm test
      - run: pnpm audit:docs-marketing
      - run: pnpm audit:package-surface
      - run: pnpm audit:content-package
      - run: pnpm audit:blueprint-matrix
        if: matrix.node-version == 20
      - run: pnpm run showcase:validate
        if: matrix.node-version == 20
      - run: pnpm run showcase:verify:shortlist
        if: matrix.node-version == 20
      - run: pnpm run showcase:dogfood-promote
        if: matrix.node-version == 20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.node-version == 20
        with:
          name: showcase-shortlist-verification
          path: apps/showcase/reports/shortlist-verification.json
