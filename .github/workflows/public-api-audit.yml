name: Audit Public API

on:
  schedule:
    - cron: '0 15 * * 3'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Audit hosted public API
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL || 'https://api.decantr.ai/v1' }}
          CONTENT_NAMESPACE: ${{ vars.CONTENT_NAMESPACE || '@official' }}
          FAIL_ON_PUBLIC_API_ERROR: ${{ vars.FAIL_ON_PUBLIC_API_ERROR || 'false' }}
        run: node scripts/audit-public-api.mjs --include-hosted-pack-select --report-json=public-api-report.json --summary-markdown=public-api-summary.md

      - name: Publish audit summary
        run: cat public-api-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-api-audit
          path: |
            public-api-report.json
            public-api-summary.md
          if-no-files-found: error
