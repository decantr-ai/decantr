name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_wave:
        description: Release wave to publish
        required: false
        type: choice
        options:
          - all
          - foundation
          - delivery
          - experimental
        default: all
      dist_tag:
        description: Optional dist-tag override for all selected packages
        required: false
        default: ''
      only_packages:
        description: Optional comma-separated package names to publish
        required: false
        default: ''
      include_experimental:
        description: Include experimental packages such as @decantr/vite-plugin
        required: false
        type: boolean
        default: false
      dry_run_only:
        description: Generate the release plan and run publish selection as a dry run only
        required: false
        type: boolean
        default: false
      publish_auth_strategy:
        description: Publish auth strategy; auto tries OIDC first and falls back to NPM_TOKEN when available
        required: false
        type: choice
        options:
          - auto
          - oidc
          - token
        default: auto

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DECANTR_CONTENT_DIR: ${{ github.workspace }}/decantr-content
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: decantr-ai/decantr-content
          path: decantr-content
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Report toolchain versions
        run: |
          node -v
          npm -v
          pnpm -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit:package-surface
      - run: pnpm audit:release-readiness
      - run: pnpm audit:public-api -- --core-only --fail-on-error
      - run: pnpm audit:registry-portal -- --fail-on-error
      - name: Generate release plan summary
        env:
          RELEASE_WAVE: ${{ github.event.inputs.release_wave || 'all' }}
          ONLY_PACKAGES: ${{ github.event.inputs.only_packages || '' }}
        run: |
          ARGS=""
          if [ "$RELEASE_WAVE" != "all" ]; then
            ARGS="$ARGS --wave=$RELEASE_WAVE"
          fi
          if [ -n "$ONLY_PACKAGES" ]; then
            ARGS="$ARGS --only=$ONLY_PACKAGES"
          fi
          node scripts/release-plan.mjs $ARGS --summary-markdown=/tmp/package-release-plan.md
          cat /tmp/package-release-plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate enterprise release evidence
        env:
          RELEASE_WAVE: ${{ github.event.inputs.release_wave || 'all' }}
          ONLY_PACKAGES: ${{ github.event.inputs.only_packages || '' }}
          INCLUDE_EXPERIMENTAL: ${{ github.event.inputs.include_experimental || 'false' }}
        run: |
          ARGS=""
          if [ "$RELEASE_WAVE" != "all" ]; then
            ARGS="$ARGS --wave=$RELEASE_WAVE"
          fi
          if [ -n "$ONLY_PACKAGES" ]; then
            ARGS="$ARGS --only=$ONLY_PACKAGES"
          fi
          if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then
            ARGS="$ARGS --include-experimental"
          fi
          pnpm release:evidence --out=package-release-evidence $ARGS
          cat package-release-evidence/release-evidence-manifest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload enterprise release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-release-evidence
          path: package-release-evidence/**
          if-no-files-found: error
      - name: Publish packages
        env:
          RELEASE_WAVE: ${{ github.event.inputs.release_wave || 'all' }}
          DIST_TAG_OVERRIDE: ${{ github.event.inputs.dist_tag || '' }}
          ONLY_PACKAGES: ${{ github.event.inputs.only_packages || '' }}
          INCLUDE_EXPERIMENTAL: ${{ github.event.inputs.include_experimental || 'false' }}
          DRY_RUN_ONLY: ${{ github.event.inputs.dry_run_only || 'false' }}
          DECANTR_PUBLISH_AUTH_STRATEGY: ${{ github.event.inputs.publish_auth_strategy || 'auto' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ARGS=""
          if [ "$RELEASE_WAVE" != "all" ]; then
            ARGS="$ARGS --wave=$RELEASE_WAVE"
          fi
          if [ -n "$DIST_TAG_OVERRIDE" ]; then
            ARGS="$ARGS --tag-override=$DIST_TAG_OVERRIDE"
          fi
          if [ -n "$ONLY_PACKAGES" ]; then
            ARGS="$ARGS --only=$ONLY_PACKAGES"
          fi
          if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then
            ARGS="$ARGS --include-experimental"
          fi
          if [ "$DRY_RUN_ONLY" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          ARGS="$ARGS --auth-strategy=$DECANTR_PUBLISH_AUTH_STRATEGY"
          node scripts/publish-packages.mjs $ARGS
      - name: Verify published npm packages
        if: ${{ github.event.inputs.dry_run_only != 'true' }}
        env:
          RELEASE_WAVE: ${{ github.event.inputs.release_wave || 'all' }}
          DIST_TAG_OVERRIDE: ${{ github.event.inputs.dist_tag || '' }}
          ONLY_PACKAGES: ${{ github.event.inputs.only_packages || '' }}
          INCLUDE_EXPERIMENTAL: ${{ github.event.inputs.include_experimental || 'false' }}
          RELEASE_VERIFICATION_WEBHOOK_URL: ${{ secrets.RELEASE_VERIFICATION_WEBHOOK_URL }}
          TELEMETRY_HEALTH_WEBHOOK_URL: ${{ secrets.TELEMETRY_HEALTH_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "$RELEASE_WAVE" != "all" ]; then
            ARGS="$ARGS --wave=$RELEASE_WAVE"
          fi
          if [ -n "$DIST_TAG_OVERRIDE" ]; then
            ARGS="$ARGS --tag-override=$DIST_TAG_OVERRIDE"
          fi
          if [ -n "$ONLY_PACKAGES" ]; then
            ARGS="$ARGS --only=$ONLY_PACKAGES"
          fi
          if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then
            ARGS="$ARGS --include-experimental"
          fi
          if [ -n "$RELEASE_VERIFICATION_WEBHOOK_URL$TELEMETRY_HEALTH_WEBHOOK_URL" ]; then
            ARGS="$ARGS --send-webhook"
          fi
          node scripts/verify-published-packages.mjs $ARGS --retries=6 --retry-delay=10000
