name: Decantr 3.10 evaluator qualification
run-name: Decantr 3.10 evaluator qualification - source ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID containing the sealed qualification-input artifact
        required: true
        type: string
      input_artifact:
        description: Exact artifact name containing request.json and its bound inputs
        required: true
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-3-10-evaluator-qualification-${{ github.ref }}-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Host-isolated evaluator qualification
    if: (github.repository == 'decantr-ai/decantr' || github.repository == 'decantr-ai/decantr-qualification-private') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Resolve the sealed input controller commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          case "$GITHUB_REPOSITORY" in
            decantr-ai/decantr)
              EXPECTED_SOURCE_PATH=".github/workflows/benchmark-3-10-qualification-input.yml"
              test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "false"
              ;;
            decantr-ai/decantr-qualification-private)
              EXPECTED_SOURCE_PATH=".github/workflows/benchmark-3-10-private-qualification-input.yml"
              test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "true"
              ;;
            *)
              exit 1
              ;;
          esac
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          SOURCE_RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          SOURCE_SHA="$(jq -r .head_sha <<<"$SOURCE_RUN")"
          test "$(jq -r .head_repository.full_name <<<"$SOURCE_RUN")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .path <<<"$SOURCE_RUN")" = "$EXPECTED_SOURCE_PATH"
          test "$(jq -r .event <<<"$SOURCE_RUN")" = "workflow_dispatch"
          test "$(jq -r .conclusion <<<"$SOURCE_RUN")" = "success"
          test "$(jq -r .head_branch <<<"$SOURCE_RUN")" = "main"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the qualification controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Select the locked controller Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.17.0
          cache: ''

      - name: Install the pinned Sigstore verifier for private evidence
        if: github.repository == 'decantr-ai/decantr-qualification-private'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Reclaim reviewed hosted runner storage
        run: |
          bash .github/scripts/benchmark-3-10-reclaim-storage.sh \
            "$RUNNER_TEMP/qualification-output/hosted-runner-storage" \
            25769803776

      - name: Download sealed qualification inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.input_artifact }}
          path: qualification-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify the host boundary without Docker execution
        run: node --test scripts/benchmark-3-10/evaluators/container-orchestrator.test.mjs

      - name: Authenticate the isolated evaluator to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Hydrate the exact source snapshots
        run: |
          node scripts/benchmark-3-10/evaluators/qualification-input.mjs \
            --mode hydrate \
            --input-root "$GITHUB_WORKSPACE/qualification-input" \
            --request request.json \
            --workspace-root "$RUNNER_TEMP/qualification-workspaces"

      - name: Grant the fixed non-root identity workspace access
        run: |
          WORKSPACE_ROOT="$RUNNER_TEMP/qualification-workspaces"
          RUNNER_UID="$(id -u)"
          command -v setfacl
          find "$WORKSPACE_ROOT" -type d -print0 |
            xargs -0 -r setfacl -m "u:10001:rwx,u:${RUNNER_UID}:rwx,d:u:${RUNNER_UID}:rwx"
          find "$WORKSPACE_ROOT" -type f -perm /111 -print0 |
            xargs -0 -r setfacl -m "u:10001:rwx,u:${RUNNER_UID}:rwx"
          find "$WORKSPACE_ROOT" -type f ! -perm /111 -print0 |
            xargs -0 -r setfacl -m "u:10001:rw-,u:${RUNNER_UID}:rw-"
          command -v getfacl
          for role in base expected; do
            getfacl -cp "$WORKSPACE_ROOT/$role" | grep -Fx 'user:10001:rwx'
            getfacl -cp "$WORKSPACE_ROOT/$role/.git/HEAD" | grep -Fx 'user:10001:rw-'
          done

      - name: Preload the reviewed Linux amd64 dependency proxy
        env:
          PROXY_MANIFEST_REFERENCE: docker.io/ubuntu/squid@sha256:8fafd41d6ddceb295d26eea9938321d825ac5351c7e46cf6a8aa5d093b8ed1ce
        run: |
          REQUEST_DIGEST="$(jq -r .dependencyProxy.image.digest qualification-input/request.json)"
          [[ "$REQUEST_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull --platform linux/amd64 "$PROXY_MANIFEST_REFERENCE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$PROXY_MANIFEST_REFERENCE")" = "linux/amd64"
          test "$(docker image inspect --format '{{.Id}}' "$PROXY_MANIFEST_REFERENCE")" = "$REQUEST_DIGEST"

      - name: Execute isolated preparation and evaluator qualification
        run: |
          node scripts/benchmark-3-10/evaluators/container-orchestrator.mjs \
            --request request.json \
            --input-root "$GITHUB_WORKSPACE/qualification-input" \
            --workspace-root "$RUNNER_TEMP/qualification-workspaces" \
            --artifact-root "$RUNNER_TEMP/qualification-output" \
            --out "$RUNNER_TEMP/qualification-output/execution-attestation.json"

      - name: Remove GHCR reader credentials
        if: always()
        run: docker logout ghcr.io

      - name: Create GitHub OIDC provenance for retained evidence
        if: success() && github.repository == 'decantr-ai/decantr'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ runner.temp }}/qualification-output/execution-attestation.json

      - name: Retain and verify the offline provenance bundle
        if: success() && github.repository == 'decantr-ai/decantr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-output/provenance-download"
          cd "$RUNNER_TEMP/qualification-output/provenance-download"
          gh attestation download ../execution-attestation.json --repo "$GITHUB_REPOSITORY"
          BUNDLE_PATH="$(find . -maxdepth 1 -type f -name 'sha256*.jsonl' -print -quit)"
          test -n "$BUNDLE_PATH"
          gh attestation verify ../execution-attestation.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$BUNDLE_PATH" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/benchmark-3-10-evaluator-qualification.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --deny-self-hosted-runners \
            --format json > verification.json
          mv "$BUNDLE_PATH" ../execution-attestation.provenance.jsonl
          mv verification.json ../execution-attestation.provenance-verification.json
          cd "$GITHUB_WORKSPACE"
          rmdir "$RUNNER_TEMP/qualification-output/provenance-download"

      - name: Sign and independently verify private retained evidence
        if: success() && github.repository == 'decantr-ai/decantr-qualification-private'
        run: |
          test "$GITHUB_REPOSITORY" = "decantr-ai/decantr-qualification-private"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/benchmark-3-10-evaluator-qualification.yml@$GITHUB_REF"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          SUBJECT="$RUNNER_TEMP/qualification-output/execution-attestation.json"
          BUNDLE="$RUNNER_TEMP/qualification-output/execution-attestation.provenance.sigstore.json"
          VERIFICATION="$RUNNER_TEMP/qualification-output/execution-attestation.provenance-verification.json"
          "$HOME/.cosign/cosign" sign-blob \
            --yes \
            --bundle "$BUNDLE" \
            "$SUBJECT" > /dev/null
          node scripts/benchmark-3-10/provenance/sigstore-keyless.mjs \
            --subject "$SUBJECT" \
            --bundle "$BUNDLE" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow benchmark-3-10-evaluator-qualification.yml \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --event "$GITHUB_EVENT_NAME" \
            --cosign "$HOME/.cosign/cosign" \
            --out "$VERIFICATION"

      - name: Assemble the bound prepared base workspace
        if: success()
        run: |
          set -euo pipefail
          QUALIFICATION_ROOT="$RUNNER_TEMP/qualification-output"
          WORKSPACE_ROOT="$RUNNER_TEMP/qualification-workspaces/base"
          OUTPUT_ROOT="$RUNNER_TEMP/prepared-workspace-output"
          mkdir -p "$OUTPUT_ROOT"
          EXECUTION="$QUALIFICATION_ROOT/execution-attestation.json"
          PREPARED="$QUALIFICATION_ROOT/prepared-environment.json"
          test -f "$EXECUTION"
          test -f "$PREPARED"
          test "$(sha256sum "$PREPARED" | cut -d ' ' -f 1)" = \
            "$(jq -r .preparation.preparedEnvironment.fileSha256 "$EXECUTION")"
          test "$(jq -r .environmentSha256 "$PREPARED")" = \
            "$(jq -r .preparation.preparedEnvironment.environmentSha256 "$EXECUTION")"
          test "$(jq -r .attestationSha256 "$PREPARED")" = \
            "$(jq -r .preparation.preparedEnvironment.attestationSha256 "$EXECUTION")"
          cp "$EXECUTION" "$OUTPUT_ROOT/execution-attestation.json"
          cp "$PREPARED" "$OUTPUT_ROOT/prepared-environment.json"
          cp "$QUALIFICATION_ROOT/execution-attestation.provenance-verification.json" \
            "$OUTPUT_ROOT/execution-attestation.provenance-verification.json"
          if [ "$GITHUB_REPOSITORY" = "decantr-ai/decantr" ]; then
            PROVENANCE_FILE="execution-attestation.provenance.jsonl"
          else
            PROVENANCE_FILE="execution-attestation.provenance.sigstore.json"
          fi
          cp "$QUALIFICATION_ROOT/$PROVENANCE_FILE" "$OUTPUT_ROOT/$PROVENANCE_FILE"
          tar --create --file "$OUTPUT_ROOT/workspace.tar" \
            --directory "$WORKSPACE_ROOT" .
          if tar --list --file "$OUTPUT_ROOT/workspace.tar" |
            grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "prepared workspace tar contains an unsafe path" >&2
            exit 1
          fi
          jq -n -S \
            --arg executionAttestationFileSha256 "$(sha256sum "$EXECUTION" | cut -d ' ' -f 1)" \
            --arg preparedEnvironmentFileSha256 "$(sha256sum "$PREPARED" | cut -d ' ' -f 1)" \
            --arg workspaceTarFileSha256 "$(sha256sum "$OUTPUT_ROOT/workspace.tar" | cut -d ' ' -f 1)" \
            --arg workspacePreparedSha256 "$(jq -r .preparation.roles.base.workspacePreparedSha256 "$EXECUTION")" \
            --arg environmentSha256 "$(jq -r .environmentSha256 "$PREPARED")" \
            --arg provenanceFile "$PROVENANCE_FILE" \
            '{
              schemaVersion: "decantr-benchmark-prepared-workspace-artifact.v1",
              executionAttestationFileSha256: $executionAttestationFileSha256,
              preparedEnvironmentFileSha256: $preparedEnvironmentFileSha256,
              workspaceTarFileSha256: $workspaceTarFileSha256,
              workspacePreparedSha256: $workspacePreparedSha256,
              environmentSha256: $environmentSha256,
              provenanceFile: $provenanceFile
            }' > "$OUTPUT_ROOT/manifest.json"

      - name: Upload retained qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-3-10-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-output
          if-no-files-found: warn
          retention-days: 1

      - name: Upload the prepared base workspace
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-3-10-prepared-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared-workspace-output
          if-no-files-found: error
          retention-days: 1
