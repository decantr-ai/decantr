name: Decantr 3.10 private qualification input
run-name: Decantr 3.10 private input - ${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Exact sealed qualification task ID
        required: true
        type: string
      proxy_image_digest:
        description: Config digest for the pinned Linux amd64 docker.io/ubuntu/squid image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-3-10-private-qualification-input-${{ github.ref }}-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  seal:
    name: Seal private qualification input
    if: github.repository == 'decantr-ai/decantr-qualification-private' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Enforce the private producer identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "decantr-ai/decantr-qualification-private"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "true"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
          cache: ''
      - name: Require an exact reviewed proxy digest
        env:
          PROXY_IMAGE_DIGEST: ${{ inputs.proxy_image_digest }}
        run: '[[ "$PROXY_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]'
      - name: Acquire frozen revisions and seal the private input
        env:
          PROXY_IMAGE_DIGEST: ${{ inputs.proxy_image_digest }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          node scripts/benchmark-3-10/evaluators/prepare-private-input.mjs \
            --task-id "$TASK_ID" \
            --corpus-root "$RUNNER_TEMP/corpus" \
            --output-root "$RUNNER_TEMP/qualification-input" \
            --proxy-image-digest "$PROXY_IMAGE_DIGEST"
      - name: Upload sealed short-lived private input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-3-10-private-qualification-input-${{ inputs.task_id }}
          path: ${{ runner.temp }}/qualification-input
          if-no-files-found: error
          retention-days: 3
