name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'decantr-ai/decantr'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Generate sitemap
        run: node scripts/generate-docs-sitemap.mjs
      - name: Configure public analytics
        env:
          DECANTR_ANALYTICS_DISABLED: ${{ vars.DECANTR_ANALYTICS_DISABLED || 'false' }}
          X_EVENT_MARKETING_COMMAND_CLICKED_ID: ${{ vars.X_EVENT_MARKETING_COMMAND_CLICKED_ID }}
          X_EVENT_MARKETING_CTA_CLICKED_ID: ${{ vars.X_EVENT_MARKETING_CTA_CLICKED_ID }}
          X_EVENT_MARKETING_OUTBOUND_CLICKED_ID: ${{ vars.X_EVENT_MARKETING_OUTBOUND_CLICKED_ID }}
          X_EVENT_MARKETING_PAGE_VIEWED_ID: ${{ vars.X_EVENT_MARKETING_PAGE_VIEWED_ID }}
          X_PIXEL_ID: ${{ vars.X_PIXEL_ID }}
        run: |
          node <<'NODE'
          const { writeFileSync } = require('node:fs');

          const xEvents = {
            'marketing_web.command_clicked': process.env.X_EVENT_MARKETING_COMMAND_CLICKED_ID || '',
            'marketing_web.cta_clicked': process.env.X_EVENT_MARKETING_CTA_CLICKED_ID || '',
            'marketing_web.outbound_clicked': process.env.X_EVENT_MARKETING_OUTBOUND_CLICKED_ID || '',
            'marketing_web.page_viewed': process.env.X_EVENT_MARKETING_PAGE_VIEWED_ID || '',
          };

          const config = {
            disabled: process.env.DECANTR_ANALYTICS_DISABLED === 'true',
            environment: 'production',
            xEvents: Object.fromEntries(Object.entries(xEvents).filter(([, value]) => value)),
            xPixelId: process.env.X_PIXEL_ID || '',
          };

          writeFileSync(
            'docs/analytics-config.js',
            `window.DECANTR_ANALYTICS_CONFIG = ${JSON.stringify(config, null, 2)};\n`,
          );
          NODE
      - name: Inject live stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-docs-stats.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs --sitemap https://decantr.ai/sitemap.xml
