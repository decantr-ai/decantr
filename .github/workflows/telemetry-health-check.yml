name: Telemetry Health Check

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      send_webhook_test:
        description: 'Post the health summary to TELEMETRY_HEALTH_WEBHOOK_URL even when healthy'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Check durable telemetry health
        env:
          DECANTR_API_URL: ${{ vars.DECANTR_API_URL || 'https://api.decantr.ai/v1' }}
          DECANTR_TELEMETRY_SNAPSHOT_TOKEN: ${{ secrets.DECANTR_TELEMETRY_SNAPSHOT_TOKEN || secrets.DECANTR_ADMIN_KEY }}
          TELEMETRY_HEALTH_WEBHOOK_URL: ${{ secrets.TELEMETRY_HEALTH_WEBHOOK_URL }}
          TELEMETRY_HEALTH_WEBHOOK_ALWAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.send_webhook_test && 'true' || 'false' }}
        run: |
          if [ -z "$DECANTR_TELEMETRY_SNAPSHOT_TOKEN" ]; then
            echo "Missing DECANTR_TELEMETRY_SNAPSHOT_TOKEN. DECANTR_ADMIN_KEY is accepted as a fallback."
            exit 1
          fi

          node scripts/check-telemetry-health.mjs
