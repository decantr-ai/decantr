name: Decantr Project Health

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package manifest found; skipping dependency install."
          fi

      - name: Build Decantr CLI
        run: pnpm run build:packages

      - name: Generate Decantr health JSON
        working-directory: docs
        run: node ../packages/cli/dist/bin.js health --json --output decantr-health.json

      - name: Audit Decantr health
        working-directory: docs
        run: node ../packages/cli/dist/bin.js health --ci --fail-on error --markdown --output decantr-health.md

      - name: Publish health summary
        if: always()
        working-directory: docs
        shell: bash
        run: |
          if [ -f decantr-health.md ]; then
            cat decantr-health.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload health artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decantr-project-health
          path: |
            docs/decantr-health.json
            docs/decantr-health.md
          if-no-files-found: ignore
