<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brownfield Scan | Decantr</title>
  <meta name="description" content="Run Decantr Brownfield scan locally against an existing app without uploading source.">
  <link rel="canonical" href="https://decantr.ai/scan">
  <meta property="og:title" content="Brownfield Scan | Decantr">
  <meta property="og:description" content="Local Brownfield reconnaissance for existing applications.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://decantr.ai/scan">
  <meta property="og:image" content="https://decantr.ai/logo.svg">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <style>
    :root {
      --bg: #0d0d1a;
      --fg: #fafafa;
      --muted: #a7a7b8;
      --panel: rgba(255, 255, 255, 0.07);
      --line: rgba(255, 255, 255, 0.14);
      --cyan: #0af3eb;
      --green: #00e0ab;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "Fira Code", "Consolas", monospace;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: var(--sans);
      color: var(--fg);
      background: #0d0d1a;
      display: grid;
      place-items: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(880px, 100%); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--fg);
      text-decoration: none;
      font-weight: 700;
      margin-bottom: 48px;
    }
    .brand img { width: 28px; height: 28px; }
    .eyebrow {
      color: var(--cyan);
      font-family: var(--mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      font-size: clamp(2.6rem, 7vw, 5.6rem);
      line-height: 0.98;
      margin: 0 0 24px;
      letter-spacing: 0;
    }
    p {
      max-width: 700px;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.7;
      margin: 0;
    }
    pre {
      margin: 36px 0 0;
      padding: 18px;
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--green);
      font-family: var(--mono);
      font-size: 0.95rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border: 1px solid var(--line);
      color: var(--fg);
      text-decoration: none;
      padding: 0 18px;
      font-weight: 700;
    }
    .button.primary { color: #060610; border-color: transparent; background: var(--cyan); }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">
      <img src="/logo.svg" alt="" aria-hidden="true">
      <span>decantr</span>
    </a>
    <div class="eyebrow">Brownfield Scan</div>
    <h1>Run scan locally.</h1>
    <p>
      Hosted scan upload is retired in Decantr 3.8. Use the CLI for read-only Brownfield reconnaissance; it does not upload source code, prompts, raw paths, or project files.
    </p>
    <pre><code>npx @decantr/cli scan --project apps/web --json</code></pre>
    <div class="actions">
      <a class="button primary" href="/guides/existing-apps.md">Existing App Guide</a>
      <a class="button" href="/">Back to Docs</a>
    </div>
  </main>
  <script src="/analytics-config.js"></script>
  <script defer src="/analytics.js"></script>
</body>
</html>
